<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杂谈检索</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --bg-secondary: #fafafa;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --text-tertiary: #999;
            --border: #e5e5e5;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .nav {
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-inner {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .lang-btn:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* 主容器 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        /* 标题区 */
        .hero {
            text-align: center;
            margin-bottom: 48px;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 15px;
        }

        /* 搜索框 */
        .search-wrapper {
            margin-bottom: 24px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px;
            transition: all 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-size: 15px;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        .search-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .search-btn:hover {
            background: var(--accent-hover);
        }

        .search-btn:active {
            transform: scale(0.98);
        }

        /* 高级选项 */
        .advanced-toggle {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            padding: 8px 0;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .advanced-toggle:hover {
            color: var(--text-primary);
        }

        .advanced-toggle svg {
            transition: transform 0.2s;
        }

        .advanced-toggle.active svg {
            transform: rotate(180deg);
        }

        .advanced-panel {
            display: none;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-top: 12px;
        }

        .advanced-panel.show {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--accent);
        }

        /* 加载状态 */
        .loading {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .loading.show {
            display: block;
        }

        .loading-dots {
            display: inline-flex;
            gap: 6px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--text-tertiary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .loading-text {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 搜索结果 */
        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .results-header {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .results-header strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .result-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background: var(--bg-secondary);
            margin: 0 -12px;
            padding: 20px 12px;
            border-radius: 8px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .result-meta {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .result-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .result-snippet {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
        }

        .result-tags {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tag {
            display: inline-block;
            padding: 3px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tag.encrypted {
            background: #fef2f2;
            border-color: #fecaca;
            color: var(--danger);
        }

        /* 空状态 */
        .empty {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }

        .empty.show {
            display: block;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .empty-hint {
            font-size: 14px;
            color: var(--text-tertiary);
        }

        /* 页脚 */
        .footer {
            border-top: 1px solid var(--border);
            padding: 24px;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
            margin-top: 60px;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .hero h1 {
                font-size: 24px;
            }

            .container {
                padding: 40px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .search-btn {
                padding: 12px 16px;
            }
        }
    </style>
</head>

        function toggleLang() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateTexts();
        }

        function updateTexts() {
            const t = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

        function toggleAdvanced() {
            const panel = document.getElementById('advancedPanel');
            const toggle = document.getElementById('advancedToggle');
            panel.classList.toggle('show');
            toggle.classList.toggle('active');
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');
            document.getElementById('empty').classList.remove('show');

            await new Promise(r => setTimeout(r, 800));

            const results = sampleData.filter(item =>
                item.title.toLowerCase().includes(query.toLowerCase()) ||
                item.snippet.toLowerCase().includes(query.toLowerCase()) ||
                item.author.toLowerCase().includes(query.toLowerCase())
            );

            displayResults(results);
            document.getElementById('loading').classList.remove('show');
        }

        function displayResults(results) {
            const t = i18n[currentLang];
            const resultsEl = document.getElementById('results');
            const listEl = document.getElementById('resultsList');
            const headerEl = document.getElementById('resultsHeader');
            const emptyEl = document.getElementById('empty');

            if (results.length === 0) {
                emptyEl.classList.add('show');
                return;
            }

            headerEl.innerHTML = t.resultsCount.replace('{count}', results.length);
            listEl.innerHTML = '';

            results.forEach(item => {
                const el = document.createElement('div');
                el.className = 'result-item';
                el.onclick = () => openResult(item);
                el.innerHTML = `
                    <div class="result-title">${escapeHtml(item.title)}</div>
                    <div class="result-meta">
                        <span>${t.type}: ${t.typeNames[item.type]}</span>
                        <span>${t.author}: ${escapeHtml(item.author)}</span>
                        <span>${t.date}: ${item.date}</span>
                    </div>
                    <div class="result-snippet">${escapeHtml(item.snippet)}</div>
                    <div class="result-tags">
                        ${item.tags.map(tag => `
                            <span class="tag ${tag === '加密' || tag === 'encrypted' ? 'encrypted' : ''}">${tag}</span>
                        `).join('')}
                    </div>
                `;
                listEl.appendChild(el);
            });

            resultsEl.classList.add('show');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openResult(item) {
            const t = i18n[currentLang];
            if (item.encrypted) {
                alert(currentLang === 'zh' ?
                    '此文件已加密，需要解密密钥才能访问。' :
                    'This file is encrypted. Decryption key required.');
            } else {
                alert(`${item.title}\n\n${item.snippet}`);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        updateTexts();
    </script>
